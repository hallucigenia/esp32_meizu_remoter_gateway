name: Firmware and protocol tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test IR, learning, state ownership, recovery, and Wi-Fi
        run: |
          mkdir -p /tmp/meizu-cjson
          docker run --rm --entrypoint tar espressif/idf:v4.3.7 -C /opt/esp/idf/components/json -cf - cJSON | tar -xf - -C /tmp/meizu-cjson
          MEIZU_CJSON_DIR=/tmp/meizu-cjson/cJSON ASAN_OPTIONS=alloc_dealloc_mismatch=1:detect_leaks=1 tests/run-host.sh
      - name: Build with ESP-IDF 4.3.7
        run: |
          mkdir -p build-ack
          cp sdkconfig build-ack/sdkconfig
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project espressif/idf:v4.3.7 idf.py --no-ccache -B build-ack -DSDKCONFIG=build-ack/sdkconfig build
      - uses: actions/upload-artifact@v4
        with:
          name: meizu-gateway-ack
          path: |
            build-ack/esp32_meizu_remoter_gateway.bin
            build-ack/esp32_meizu_remoter_gateway.elf
            build-ack/sdkconfig
